server:
  port: 8080

spring:
  application:
    name: campus-ershou
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/campus_ershou?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: campus
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

app:
  jwt:
    # 生产环境必须在 application-local.yml 覆盖成随机长密钥
    secret: PleaseChangeThisJwtSecretKeyToAtLeast32Chars!!
    expire-hours: 24
  cors:
    allowed-origins:
      - http://localhost:5173
  oss:
    endpoint: ""
    bucket: ""
    access-key-id: ""
    access-key-secret: ""
    custom-domain: ""
    dir-prefix: campus-ershou/
  ai:
    base-url: https://api.deepseek.com
    api-key: ""
    model: deepseek-chat
